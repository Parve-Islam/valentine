<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #ffd4e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }

        .question {
            margin-bottom: 20px;
        }

        .question h1 {
            font-size: 3rem;
            color: #e91e63;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(233, 30, 99, 0.2);
        }

        .question p {
            font-size: 1.2rem;
            color: #c2185b;
            font-style: italic;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
            position: relative;
            min-height: 100px;
        }

        button {
            font-size: 1.5rem;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1744 100%);
            color: white;
        }

        #yesBtn:active {
            transform: scale(0.95);
        }

        #noBtn {
            background: linear-gradient(135deg, #e0e0e0 0%, #bdbdbd 100%);
            color: #616161;
            position: relative;
            transition: all 0.3s ease;
        }

        #noBtn.moving {
            position: fixed;
            transition: all 0.3s ease;
        }

        .meme-section {
            display: none;
            margin-top: 40px;
            animation: fadeIn 0.5s ease;
        }

        .meme-section.show {
            display: block;
        }

        .meme-section img {
            max-width: 300px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .meme-section h2 {
            font-size: 2rem;
            color: #e91e63;
            margin-bottom: 10px;
        }

        .meme-section p {
            font-size: 1.3rem;
            color: #c2185b;
        }

        .success-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .success-message.show {
            display: flex;
        }

        .success-message h1 {
            font-size: 4rem;
            color: #e91e63;
            margin-bottom: 20px;
        }

        .success-message p {
            font-size: 1.5rem;
            color: #c2185b;
        }

        .hearts {
            position: fixed;
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        @media (max-width: 600px) {
            .question h1 {
                font-size: 2rem;
            }

            .question p {
                font-size: 1rem;
            }

            button {
                font-size: 1.2rem;
                padding: 15px 35px;
            }

            .meme-section h2 {
                font-size: 1.5rem;
            }

            .meme-section p {
                font-size: 1.1rem;
            }

            .success-message h1 {
                font-size: 2.5rem;
            }

            .success-message p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="question">
            <h1>Will you be my Valentine? 💖</h1>
            <p>Be honest... but choose wisely 😌</p>
        </div>

        <div class="button-container">
            <button id="yesBtn">YES ❤️</button>
            <button id="noBtn">NO 😅</button>
        </div>

        <div class="meme-section" id="memeSection">
            <h2>Why are you avoiding YES? 👀</h2>
            <p>At this point, just click YES 😌</p>
            <p style="margin-top: 15px; font-size: 1.1rem;">Resistance is futile 💘</p>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <h1>Yay! I knew it 💘</h1>
        <p>Happy Valentine's Day! 🌹✨</p>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const memeSection = document.getElementById('memeSection');
        const successMessage = document.getElementById('successMessage');

        let escapeCount = 0;
        const maxEscapes = 3;

        // YES button click handler
        yesBtn.addEventListener('click', () => {
            successMessage.classList.add('show');
            createHearts();
        });

        // NO button hover handler
        noBtn.addEventListener('mouseenter', () => {
            if (escapeCount < maxEscapes) {
                moveButton();
                escapeCount++;

                if (escapeCount === maxEscapes) {
                    // Stop moving and show meme
                    setTimeout(() => {
                        noBtn.classList.remove('moving');
                        memeSection.classList.add('show');
                    }, 300);
                }
            }
        });

        // Mobile touch handler
        noBtn.addEventListener('touchstart', (e) => {
            if (escapeCount < maxEscapes) {
                e.preventDefault();
                moveButton();
                escapeCount++;

                if (escapeCount === maxEscapes) {
                    setTimeout(() => {
                        noBtn.classList.remove('moving');
                        memeSection.classList.add('show');
                    }, 300);
                }
            }
        });

        function moveButton() {
            noBtn.classList.add('moving');

            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Calculate safe boundaries (with 20px padding from edges)
            const maxX = windowWidth - btnWidth - 20;
            const maxY = windowHeight - btnHeight - 20;

            // Generate random position
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(20, Math.random() * maxY);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function createHearts() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('hearts');
                    heart.textContent = '💖';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = Math.random() * 100 + '%';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 3000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
